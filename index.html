<style>
  html, body {
    margin: 0; height: 100%; background: #0b0b14; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    cursor: crosshair; outline: none;
  }

  /* ------------------------------------------------------------ CRT screen */
  /* --px (one game pixel in CSS px) is set by fit() so scanlines line up with game rows */
  #crt {
    --px: 3px;
    position: relative; overflow: hidden; border-radius: 2.5%;
    background: #000;
    box-shadow: 0 0 calc(var(--px) * 10) rgba(46, 196, 230, .14);
  }
  #crt canvas#c { filter: saturate(1.15) contrast(1.06) brightness(1.06); }
  /* phosphor bloom: a blurred copy of each frame, added on top */
  #glow {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; mix-blend-mode: screen; opacity: .45;
    filter: blur(calc(var(--px) * 1.1));
  }
  .crt-fx { position: absolute; inset: 0; pointer-events: none; }
  /* scanlines (one per game row) + faint RGB aperture grille */
  .crt-lines {
    background:
      linear-gradient(to bottom, transparent 0 50%, rgba(0, 0, 0, .3) 50% 100%) 0 0 / 100% var(--px),
      repeating-linear-gradient(90deg, rgba(255, 40, 80, .05) 0 1px, rgba(60, 255, 120, .035) 1px 2px, rgba(60, 120, 255, .05) 2px 3px);
  }
  /* curved-glass vignette, edge shading and a soft highlight */
  .crt-glass {
    background:
      radial-gradient(ellipse 120% 90% at 30% 12%, rgba(255, 255, 255, .06), transparent 45%),
      radial-gradient(ellipse at center, transparent 58%, rgba(0, 0, 0, .55) 100%);
    box-shadow: inset 0 0 calc(var(--px) * 6) rgba(0, 0, 0, .7);
    border-radius: inherit;
    animation: crt-flicker 3.2s steps(1) infinite;
  }
  /* slow rolling refresh band */
  .crt-roll {
    top: -25%; height: 25%; bottom: auto;
    background: linear-gradient(to bottom, transparent, rgba(180, 240, 255, .045) 50%, transparent);
    animation: crt-roll 7s linear infinite;
  }
  @keyframes crt-roll { to { transform: translateY(500%); } }
  @keyframes crt-flicker {
    0%, 100% { opacity: 1; } 31% { opacity: .9; } 32% { opacity: 1; }
    67% { opacity: .94; } 68% { opacity: 1; } 89% { opacity: .92; } 90% { opacity: 1; }
  }
  #crt.off { border-radius: 0; box-shadow: none; }
  #crt.off canvas#c { filter: none; }
  #crt.off #glow, #crt.off .crt-fx { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .crt-glass { animation: none; }
    .crt-roll { display: none; }
  }
</style>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ setup */
const W = 160, H = 160;
const GAME_URL = 'https://anniv.frostbyte.art/';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

// CRT overlay: bloom canvas mirrors each frame; press C to toggle the effect
const crt = document.getElementById('crt');
const glow = document.getElementById('glow');
const gctx = glow.getContext('2d');
glow.width = W; glow.height = H;
try { if (localStorage.getItem('fb-crt') === 'off') crt.classList.add('off'); } catch (_) {}

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  cv.style.width = cw + 'px';
  cv.style.height = ch + 'px';
  crt.style.setProperty('--px', (ch / H) + 'px');
}
window.addEventListener('resize', fit);
fit();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

/* ---------------------------------------------------------------- palette */
const P = {
  k: '#0b0b14', K: '#15142a', n: '#25204a', N: '#3b3470',
  c: '#2ec4e6', C: '#9af2ff', d: '#1a7fa3', w: '#f4f6ff',
  s: '#d6cff2', S: '#8f86c0', p: '#5b26a3', P: '#9b55f0',
  m: '#ff3fd0', M: '#ff9ae9', g: '#7dff6a', G: '#2fae4a',
  y: '#ffe14d', o: '#ff8a3d', r: '#ff4057', R: '#a3172f',
  // Agent Delta's colors, taken from the original character art
  Z: '#000000', F: '#ffd9a8', f: '#efcb8d', h: '#583300', b: '#6d4e21', e: '#858585',
  l: '#d6d6d6', L: '#ebebeb', a: '#adadad', q: '#c2c2c2', W: '#ffffff', v: '#e5d9f2',
  // Frostbyte character colors, taken from the reference art
  U: '#1b237e', B: '#2962fe', I: '#e3f4fe', H: '#ff2b00', J: '#ff6b4c', E: '#b2b2b2', X: '#02ff01',
  V: '#6065a6', O: '#ee9f70', Y: '#ffc107', T: '#3b224f', Q: '#756582', D: '#a34575', A: '#ffefc9',
  j: '#4f2457', i: '#01bcd6',
  // outline tints for the aliens
  u: '#2a1650', x: '#4a0f1f', t: '#163a1c',
};
const CONFETTI = [P.m, P.c, P.y, P.g, P.P, P.w, P.o];

/* ---------------------------------------------------------------- sprites */
/* One shared art style, taken from the Frostbyte character references:
   a 1px outline in a dark tint of the sprite's own color (not pure black),
   flat colors, a darker right/bottom shade, and a 1px drop shadow on the right.
   sprite(rows, map, opts) can add these automatically:
     trim    - drop empty rows/columns around the art
     shade   - darken right/bottom edge pixels
     outline - true (black) or a hex color
     shadow  - hex color of the 1px right-side drop shadow */
const darken = (hex, f = 0.68) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * f).toString(16).padStart(2, '0')).join('');
const isDark = hex => parseInt(hex.slice(1, 3), 16) + parseInt(hex.slice(3, 5), 16) + parseInt(hex.slice(5, 7), 16) < 90;
function sprite(rows, map, opt = {}) {
  // map values can be palette keys or raw '#rrggbb' colors
  let g = rows.map(r => [...r].map(ch => { if (map && map[ch]) ch = map[ch]; return ch === '.' ? null : ch[0] === '#' ? ch : P[ch] || null; }));
  let h = g.length, w = g[0].length;
  const keep = new Set(); // outline/shadow pixels stay put in the white hit-flash
  if (opt.trim) {
    while (g.length && g[0].every(c => !c)) g.shift();
    while (g.length && g[g.length - 1].every(c => !c)) g.pop();
    let l = 0, r = 0;
    while (g.every(row => !row[l])) l++;
    while (g.every(row => !row[row.length - 1 - r])) r++;
    g = g.map(row => row.slice(l, row.length - r));
    h = g.length; w = g[0].length;
  }
  const at = (i, j) => (j >= 0 && j < h && i >= 0 && i < w) ? g[j][i] : null;
  if (opt.shade) {
    g = g.map((row, j) => row.map((c, i) => {
      if (!c || isDark(c)) return c;
      const edge = !at(i + 1, j) || !at(i, j + 1);
      return edge && at(i - 1, j) && at(i, j - 1) ? darken(c) : c;
    }));
  }
  if (opt.outline) {
    const oc = opt.outline === true ? '#000000' : opt.outline; keep.add(oc);
    const o = [];
    for (let j = -1; j <= h; j++) {
      const row = [];
      for (let i = -1; i <= w; i++) row.push(at(i, j) || (at(i - 1, j) || at(i + 1, j) || at(i, j - 1) || at(i, j + 1) ? oc : null));
      o.push(row);
    }
    g = o; w += 2; h += 2;
  }
  if (opt.shadow) {
    keep.add(opt.shadow);
    g = g.map(row => { const r = row.concat([null]); for (let i = w; i > 0; i--) if (!r[i] && r[i - 1] && r[i - 1] !== opt.shadow) r[i] = opt.shadow; return r; });
    w += 1;
  }
  const make = (white) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const col = g[j][i];
      if (col) { x.fillStyle = white && !isDark(col) && !keep.has(col) ? '#ffffff' : col; x.fillRect(i, j, 1, 1); }
    }
    return c;
  };
  const c = make(false); c.white = make(true);
  return c;
}
const pad = (s, n) => { const l = (n - s.length) >> 1; return '.'.repeat(l) + s + '.'.repeat(n - s.length - l); };
const SHADOW = '#5a5a96'; // the soft right-side drop shadow every character casts

/* --- playable Frostbytes, pixel-for-pixel from the references (they already

  '...ADCEEEEEEECCAB....',

  '...AQQQQQQQQQQQAB....',
  '..ARQQQSQQQQQQQQAB...',
  '..ATQQQQSSSQQQQCAB...',
  '..ACAQQSQSQSQQACAB...',
  '...UAEEAAAAAEEAAAB...',

const HOODIE_MAP = { A: 'T', F: 'T', G: 'T', N: 'T', U: 'T', B: 'Q', O: 'Q', C: 'D', D: 'D', T: 'D', E: 'A', H: 'A', I: 'A', K: 'A', L: 'A', J: 'j', M: 'O', V: 'O', Q: 'i', R: 'i', S: 'W', P: '.' };
// playable Frostbytes: each new game picks one at random (the title screen shows Santa)
const CHARS = [

function OVERLORD_ROWS(open) {

}
// alien popping out of its saucer (A/B = blinking lights + thruster flicker); 'Z' = outline

  pad('p' + 'P'.repeat(24) + 'p', 28), pad('p'.repeat(22), 28), pad(jets, 28),
];

  pad('CCCCCC', 32), pad('CCggggCC', 32), pad('CggwwwwggC', 32), pad('CggwZZwggC', 32), pad('CCCggggggCCC', 32),
  pad('o' + 'r'.repeat(24) + 'o', 32), pad('o' + lights.repeat(6) + 'o', 32), pad('R'.repeat(28), 32), pad('R'.repeat(20), 32),
  pad('S', 32), pad('S', 32), pad('SSSSSSSSS', 32), pad('S.......S', 32), pad('S.......S', 32),
];
// outline tints (dark versions of each sprite's main color, like the references)
const PURPLE_OL = { Z: 'u' }, RED_OL = { g: 'o', G: 'R', P: 'r', p: 'R', Z: 'x' };
const BOSS_STYLE = (ol) => ({ shade: true, outline: ol, shadow: SHADOW });

// power-up drops. Gem colors are taken from https://www.frostbyte.art/assets/gem.png;
// the frost shield and party cake reuse its shading layout in their own colors.
const GEM_ROWS = [
  '...aaaaa...',
  '..abbbcca..',
  '.abgdddeca.',
  'abghdbddefa',
  'abddbddhdea',
  'abdbddbddea',
  'abddhbddeia',
  'abdbddddeia',
  '.abeddeeia.',

  '...aaaaa...',
];

const SHIELD_ROWS = [

  '..abbbcca..',

  'abhgdgdgefa',

  orb: sprite(['..ZZZ..', '.ZMwMZ.', 'ZMwwMPZ', 'ZMMMMPZ', 'ZPMMPpZ', '.ZPppZ.', '..ZZZ..'], PURPLE_OL),
  // ally: Agent Delta from Planet Delta (pixel-for-pixel from the character art, 19x18) + drop shadow
  ally: sprite([
    '..KKK.KKKKKKKKKK...',
    '.KFFFKKFFFFFffKKKK.',
    'KKFhhhKFhhhhfhhKhK.',
    'KFhhhKFFhKKhhKhKhhK',

  ], { K: 'Z', c: 'q', w: 'W' }, { shadow: SHADOW }),
  // drops: 11px, drawn in the style of frostbyte.art's gem (pale glowing outline,

  heart: sprite(['.ZZZ.ZZZ.', 'ZrwrZrrrZ', 'ZrrrrrrRZ', 'ZrrrrrrRZ', '.ZrrrrRZ.', '..ZrrRZ..', '...ZRZ...', '....Z....'], { Z: 'x' }, { shadow: SHADOW }),

/* ------------------------------------------------------------- pixel font */
const FONT = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
  E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
  I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
  Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111',
  0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
  4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010',
  8: '111101111101111', 9: '111101111001110',
  '!': '010010010000010', '.': '000000000000010', ':': '000010000010000', '-': '000000111000000',
  '/': '001001010100100', '?': '110001010000010', '+': '000010111010000', "'": '010010000000000',
  ',': '000000000010100', '#': '101111101111101', ' ': '000000000000000',
};
const textW = (s, sc = 1) => s.length * 4 * sc - sc;
function drawStr(s, x, y, col, sc) {
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]];
    if (!g) continue;
    for (let b = 0; b < 15; b++) if (g[b] === '1')
      ctx.fillRect(x + i * 4 * sc + (b % 3) * sc, y + ((b / 3) | 0) * sc, sc, sc);
  }
}
function text(s, x, y, col, sc = 1, align = 'l', shadow) {
  s = String(s).toUpperCase();
  if (align === 'c') x = Math.round(x - textW(s, sc) / 2);

function updateBg(dt) {

      vx: fromTop ? rnd(-6, 6) : rnd(-70, 70), vy: fromTop ? rnd(10, 25) : rnd(-90, -20),

/* ------------------------------------------------------------------- ally */
// Agent Delta flies in for every boss fight on a delta hoverboard:
// shoots at the boss, drops supplies, warns you about the beam, and
// pops the Overlord's orbs with homing Delta Pulses.
let ally = null, allyShots = [];
function allyArrive() {

  ally.leave = 0; ally.warned = 0; ally.saidDrop = false;

    if (o.hp <= 0) continue;
    const p = orbPos(b, o);
    if (Math.abs(s.x - p.x) < 4 && Math.abs(s.y - p.y) < 4) {
      o.hp--;

      else { SFX.hit(); burst(p.x, p.y, [P.M, P.w], 3, 25, 0.2); }

function updateAlly(dt) {

    const a = ally; a.t += dt;
    if (a.leave > 0 && (a.leave -= dt) <= 0) a.leave = -1;
    if (a.leave < 0) { // flying home
      a.x -= 80 * dt; a.y -= 25 * dt;
      if (a.x < -24) ally = null;
    } else {
      // hover on the opposite side of the player, between the player and the boss
      const tx = clamp(player.x < 80 ? player.x + 44 : player.x - 44, 14, 146);
      a.x += clamp(tx - a.x, -60 * dt, 60 * dt);
      a.y = 77 + Math.sin(a.t * 2.2) * 2; // between the boss and the dialogue box
      if (boss && boss.entered) {
        a.fire -= dt;

          allyShots.push({ x: a.x + 2, y: a.y - 2, vx: dx / d * 120, vy: dy / d * 120 });
          SFX.ally();
        }
        a.drop -= dt;
        if (a.drop <= 0) {
          a.drop = rnd(11, 14);

        }

const STEP = 1 / 60;
function update(dt) {

  }

  if (G.shake > 0) G.shake -= dt;

    pl.x += dx * 100 * dt; pl.tx = pl.x;

    if (pl.triple > 0) bullets.push({ x: pl.x - 3, y: pl.y, vx: -42, vy: -155 }, { x: pl.x + 3, y: pl.y, vx: 42, vy: -155 });

  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.vy * dt; e.ph += dt * e.sp;
    e.bx = clamp(e.bx, 8 + e.amp, 152 - e.amp);
    e.x = e.bx + Math.sin(e.ph) * e.amp;
    if (e.hit > 0) e.hit -= dt;
    if (e.t === 2 || G.wave >= 3) {
      e.shoot -= dt;
      if (e.shoot <= 0 && e.y > 4 && e.y < 112) {
        ebullets.push({ x: e.x, y: e.y + 9, vx: clamp((pl.x - e.x) * 0.3, -30, 30), vy: 52 + G.wave * 3 });
        e.shoot = e.t === 2 ? rnd(1.6, 3) : rnd(3, 5.5);
      }
    }
    // collide with player
    if (Math.abs(e.x - pl.x) < 11 && e.y + 9 > pl.y + pl.h * 0.25 && e.y < pl.y + pl.h - 2) {
      enemies.splice(i, 1); burst(e.x, e.y + 3, [P.g, P.P], 12, 50); SFX.boom(); hurtPlayer(); continue;
    }
    // landed: lose a heart
    if (e.y > 143) {
      enemies.splice(i, 1); burst(e.x, 148, [P.r, P.o, P.w], 16, 60);
      if (player.inv <= 0) banner('ALIEN LANDED!', '', 0.9, P.r);
      hurtPlayer(); continue;
    }
  }
  if (G.state !== 'play') { updParts(dt); return; } // died this tick: stop the rest of gameplay

  // bullets vs enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.x > e.x - 7 && b.x < e.x + 7 && b.y > e.y - 2 && b.y < e.y + 8) {
        bullets.splice(j, 1);
        e.hp--; e.hit = 0.08;
        if (e.hp <= 0) { killEnemy(e, i); break; }
        SFX.hit(); burst(b.x, b.y, [P.w, P.C], 4, 30, 0.25);
      }
    }
  }

  // boss
  if (boss) updateBoss(dt);
  updateAlly(dt);

  // enemy bullets
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > 152 || b.y < -6 || b.x < -6 || b.x > W + 6) { ebullets.splice(i, 1); continue; }
    if (Math.abs(b.x - pl.x) < 6 && b.y > pl.y + pl.h * 0.25 && b.y < pl.y + pl.h - 1) { ebullets.splice(i, 1); hurtPlayer(); }
  }
  if (G.state !== 'play') { updParts(dt); return; }

  // pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const k = pickups[i]; k.t += dt; k.y += 26 * dt;
    if (k.y > 146) { pickups.splice(i, 1); continue; }
    if (Math.abs(k.x - pl.x) < 11 && k.y + 9 > pl.y && k.y < pl.y + pl.h) {
      pickups.splice(i, 1); SFX.power();
      burst(k.x, k.y + 3, CONFETTI, 18, 50);
      if (k.type === 'cake') { pl.triple = 9; banner('PARTY CAKE!', 'TRIPLE SNOWBALLS', 1.2, P.M); }
      else if (k.type === 'flake') { pl.shield = 10; banner('FROST SHIELD!', '', 1.2, P.C); }
      else if (k.type === 'gem') { pl.rapid = 6; banner('POWER GEM!', 'RAPID FIRE', 1.2, '#e84fff'); }
      else { G.lives = Math.min(5, G.lives + 1); banner('+1 HEART', '', 1.2, P.r); }
      G.score += 15;
    }
  }

  // new sky every THEME_EVERY points
  if (G.state === 'play') {
    const ti = Math.floor(G.score / THEME_EVERY) % THEMES.length;
    if (ti !== bgState.cur) setTheme(ti);
  }

  updParts(dt);
}

/* -------------------------------------------------------------------- draw */
const BTN = {
  retry: { x: 48, y: 96, w: 64, h: 13 },
  share: { x: 36, y: 114, w: 88, h: 13 },
  mute: { x: 148, y: 151, w: 11, h: 9 },
};
function box(b, label, col) {
  ctx.fillStyle = P.K; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = col;
  ctx.fillRect(b.x + 1, b.y, b.w - 2, 1); ctx.fillRect(b.x + 1, b.y + b.h - 1, b.w - 2, 1);
  ctx.fillRect(b.x, b.y + 1, 1, b.h - 2); ctx.fillRect(b.x + b.w - 1, b.y + 1, 1, b.h - 2);
  text(label, b.x + b.w / 2, b.y + ((b.h - 5) >> 1), col, 1, 'c');
}
function drawMute() {
  const b = BTN.mute, x = b.x + 1, y = b.y + 2;
  ctx.fillStyle = muted ? P.S : P.C;
  ctx.fillRect(x, y + 1, 2, 3); ctx.fillRect(x + 2, y, 1, 5); ctx.fillRect(x + 3, y - 1, 1, 7);
  if (muted) { ctx.fillStyle = P.r; ctx.fillRect(x + 5, y, 1, 1); ctx.fillRect(x + 6, y + 1, 1, 1); ctx.fillRect(x + 7, y + 2, 1, 1); ctx.fillRect(x + 6, y + 3, 1, 1); ctx.fillRect(x + 5, y + 4, 1, 1); ctx.fillRect(x + 7, y, 1, 1); ctx.fillRect(x + 7, y + 4, 1, 1); ctx.fillRect(x + 5, y + 2, 1, 1); }
  else { ctx.fillRect(x + 5, y + 1, 1, 3); ctx.fillRect(x + 7, y, 1, 5); }
}
function drawPlayer(x, y, sc = 1, ci = G.char) {
  const s = CHARS[ci].spr;
  ctx.drawImage(s, Math.round(x - (s.width >> 1) * sc), Math.round(y), s.width * sc, s.height * sc);
}
function drawShield(x, y) {
  ctx.fillStyle = ((G.t * 8) | 0) % 2 ? P.C : P.c;
  for (let a = 0; a < 20; a++) {
    const ang = a / 20 * 6.283 + G.t * 2;
    ctx.fillRect(Math.round(x + Math.cos(ang) * 13), Math.round(y + (player.h >> 1) + Math.sin(ang) * 13), 1, 1);
  }
}

function draw() {
  ctx.save();
  if (G.shake > 0) ctx.translate(((Math.random() * 3) | 0) - 1, ((Math.random() * 3) | 0) - 1);
  drawBackground(G.t);

  if (G.state === 'title') drawTitle();
  else drawPlay();

  // particles
  for (const q of parts) {
    ctx.fillStyle = q.c;
    if (q.conf) ctx.fillRect(q.x | 0, q.y | 0, Math.sin(q.p) > 0 ? 2 : 1, 1);
    else ctx.fillRect(q.x | 0, q.y | 0, 1, 1);
  }
  ctx.restore();

  if (G.state === 'over') drawOver();
  if (G.state === 'paused') {
    ctx.fillStyle = 'rgba(11,11,20,0.7)'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', 80, 66, P.C, 2, 'c', P.p);
    if (((G.t * 2) | 0) % 2 === 0) text('TAP TO RESUME', 80, 88, P.w, 1, 'c');
  }
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,64,87,0.35)'; ctx.fillRect(0, 0, W, H); }
  drawMute();
}

function drawTitle() {
  const t = G.t;
  // title
  text('FROSTBYTE', 80, 14, P.c, 3, 'c', P.p);
  ctx.fillStyle = P.m; ctx.fillRect(22, 33, 116, 1);
  text('2ND ANNIVERSARY', 80, 37, P.M, 1, 'c');
  text('ALIEN DEFENSE', 80, 46, P.w, 2, 'c', P.n);

  // Santa as the title mascot (which Frostbyte you play is picked at random on start)
  const bob = Math.round(Math.sin(t * 4) * 2);
  drawPlayer(80, 106 - CHARS[0].spr.height * 2 + bob, 2, 0);
  // saucers lurking at the sides
  const f = ((t * 6) | 0) % 2;
  ctx.drawImage(f ? SPR.ufo1a : SPR.ufo1b, 4, Math.round(68 + Math.sin(t * 2) * 3));
  ctx.drawImage(f ? SPR.ufo2a : SPR.ufo2b, 141, Math.round(74 + Math.sin(t * 2 + 2) * 3));
  // birthday cake on the snow
  ctx.drawImage(SPR.cake, 17, 140);
  ctx.drawImage(SPR.cake, 134, 140);

  if (((t * 2.2) | 0) % 2 === 0) text('TAP OR SPACE TO PLAY', 80, 117, P.C, 1, 'c');
  text('DRAG / ARROWS. AUTO-FIRE.', 80, 126, P.S, 1, 'c');
  if (G.best > 0) text('BEST ' + G.best, 80, 136, P.y, 1, 'c');
}

function drawBoss(f) {
  const b = boss, bx = Math.round(b.x), by = Math.round(b.y);
  if (b.type === 0) {
    let s = f ? SPR.bossA : SPR.bossB;
    if (b.hit > 0) s = s.white;
    ctx.drawImage(s, bx - 15, by - 1);
    ctx.fillStyle = P.G; // tractor beam shimmer
    const ph = (G.t * 12) | 0;
    for (let j = 0; j < 18; j++) {
      const half = 2 + (j >> 2);
      for (let i = -half; i <= half; i++) if (((i + j + ph) & 3) === 0) ctx.fillRect(bx + i, by + 10 + j, 1, 1);
    }
  } else if (b.type === 1) {
    if (b.beam > 0) {
      const x = Math.round(b.beamX), top = by + 22;
      if (b.beam > 0.8) { // warning
        if (((G.t * 14) | 0) % 2) {
          ctx.fillStyle = P.r;
          for (let y = top; y < 150; y += 3) ctx.fillRect(x, y, 1, 1);
          ctx.fillRect(x - 5, 148, 11, 1);
        }
      } else { // firing
        const w = 4 + (((G.t * 30) | 0) % 2);
        ctx.fillStyle = P.m; ctx.fillRect(x - w, top, w * 2 + 1, 150 - top);
        ctx.fillStyle = P.M; ctx.fillRect(x - 2, top, 5, 150 - top);
        ctx.fillStyle = P.w; ctx.fillRect(x, top, 1, 150 - top);
      }
    }
    let s = f ? SPR.snatchA : SPR.snatchB;
    if (b.hit > 0) s = s.white;
    ctx.drawImage(s, bx - 16, by - 1);
    ctx.drawImage(SPR.cake, bx - 5, by + 12); // the stolen cake
  } else {
    const back = [], front = [];
    for (const o of b.orbs) if (o.hp > 0) (Math.sin(o.a) < 0 ? back : front).push(orbPos(b, o));
    for (const p of back) ctx.drawImage(SPR.orb, Math.round(p.x) - 3, Math.round(p.y) - 3);
    let s = b.ring < 0.45 ? SPR.overB : SPR.overA;
    if (b.hit > 0) s = s.white;
    ctx.drawImage(s, bx - 12, by - 1);
    for (const p of front) ctx.drawImage(SPR.orb, Math.round(p.x) - 3, Math.round(p.y) - 3);
  }
  // hp bar + name
  text(BOSS_NAMES[b.type] + (b.rep ? ' LV' + (b.rep + 1) : ''), 80, 8, P.S, 1, 'c');
  ctx.fillStyle = P.n; ctx.fillRect(40, 14, 80, 3);
  ctx.fillStyle = P.r; ctx.fillRect(40, 14, Math.ceil(80 * b.hp / b.max), 3);
  ctx.fillStyle = P.M; ctx.fillRect(40, 14, Math.ceil(80 * b.hp / b.max), 1);
}

function drawPlay() {
  const f = ((G.t * 6) | 0) % 2;
  // story dialogue sits behind the action so it never hides bullets
  if (G.state === 'play') drawTalk();
  // pickups
  for (const k of pickups) {
    const s = SPR[k.type], yy = Math.round(k.y + Math.sin(k.t * 6));
    if (((k.t * 10) | 0) % 6 === 0) { ctx.fillStyle = P.w; ctx.fillRect(k.x - 5, yy + 3, 1, 1); ctx.fillRect(k.x + 5, yy + 3, 1, 1); }
    ctx.drawImage(s, Math.round(k.x - (s.width >> 1)), yy);
  }
  // enemies
  for (const e of enemies) {
    let s = e.t === 2 ? (f ? SPR.ufo2a : SPR.ufo2b) : (f ? SPR.ufo1a : SPR.ufo1b);
    if (e.hit > 0) s = s.white;
    ctx.drawImage(s, Math.round(e.x - 7), Math.round(e.y - 2));
  }
  // boss
  if (boss) drawBoss(f);
  if (ally) drawAlly();
  // bullets
  for (const b of bullets) ctx.drawImage(SPR.snow, Math.round(b.x - 1), Math.round(b.y - 1));
  drawAllyShots();
  for (const b of ebullets) {
    ctx.fillStyle = P.Z; ctx.fillRect(Math.round(b.x - 2), Math.round(b.y - 2), 4, 5);
    ctx.fillStyle = f ? P.r : '#ff7a4a'; ctx.fillRect(Math.round(b.x - 1), Math.round(b.y - 1), 2, 3);
    ctx.fillStyle = P.w; ctx.fillRect(Math.round(b.x - 1), Math.round(b.y), 1, 1);
  }
  // player
  const pl = player;
  if (G.state !== 'over' && !(pl.inv > 0 && ((G.t * 14) | 0) % 2)) drawPlayer(pl.x, pl.y);
  if (pl.shield > 0 && (pl.shield > 2 || ((G.t * 10) | 0) % 2)) drawShield(pl.x, pl.y);

  // HUD
  text(String(G.score).padStart(6, '0'), 2, 2, P.w, 1, 'l', P.n);
  text('W' + G.wave, 80, 2, P.S, 1, 'c');
  for (let i = 0; i < 5; i++) {
    const x = 152 - i * 7;
    if (i < G.lives) ctx.drawImage(SPR.heartS, x, 1);
    else if (i < 3) ctx.drawImage(SPR.heartE, x, 1);
  }
  let by = 9;
  if (pl.triple > 0) { ctx.fillStyle = P.m; ctx.fillRect(2, by, Math.ceil(pl.triple / 9 * 24), 1); by += 2; }
  if (pl.shield > 0) { ctx.fillStyle = P.C; ctx.fillRect(2, by, Math.ceil(pl.shield / 10 * 24), 1); by += 2; }
  if (pl.rapid > 0) { ctx.fillStyle = '#e84fff'; ctx.fillRect(2, by, Math.ceil(pl.rapid / 6 * 24), 1); }

  // name of the sky we just moved to, written on the snow
  if (bgState.nameT > 0 && !(bgState.nameT < 0.5 && ((G.t * 10) | 0) % 2)) text(THEMES[bgState.cur].name, 80, 154, P.w, 1, 'c');

  // banner
  if (G.banner && G.state === 'play') {
    const b = G.banner;
    const blink = b.t < 0.4 && ((G.t * 12) | 0) % 2;
    if (!blink) {
      const sc = b.text.length > 18 ? 1 : 2;
      text(b.text, 80, 56, b.col, sc, 'c', P.p);
      if (b.sub) text(b.sub, 80, sc === 2 ? 70 : 64, P.S, 1, 'c');
    }
  }
}

function drawOver() {
  ctx.fillStyle = 'rgba(11,11,20,0.78)'; ctx.fillRect(0, 0, W, H);
  text('GAME OVER', 80, 22, P.m, 2, 'c', P.p);
  text('THE ALIENS ATE THE CAKE', 80, 38, P.S, 1, 'c');
  text('SCORE', 80, 52, P.S, 1, 'c');
  text(String(G.score), 80, 60, P.w, 2, 'c', P.n);
  if (G.newBest) { if (((G.t * 3) | 0) % 2 === 0) text('NEW BEST!', 80, 76, P.y, 1, 'c'); }
  else text('BEST ' + G.best, 80, 76, P.y, 1, 'c');
  text('REACHED WAVE ' + G.wave, 80, 84, P.S, 1, 'c');
  if (G.overT > 0.8) {
    box(BTN.retry, 'PLAY AGAIN', P.C);
    box(BTN.share, 'SHARE SCORE ON X', P.M);
  }
}

/* ------------------------------------------------------------------- input */
const keys = { left: false, right: false };
let ctrl = 'ptr';
let drag = null;

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const inBtn = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

function share() {
  const msg = `I scored ${G.score} defending FROSTBYTE from an alien invasion at its 2nd anniversary party! Can you beat me? ❄️👾🎂`;
  const url = 'https://x.com/intent/tweet?text=' + encodeURIComponent(msg) + '&url=' + encodeURIComponent(GAME_URL);
  const w = window.open(url, '_blank', 'noopener');
  if (!w) { try { window.top.location.href = url; } catch (e) { location.href = url; } }
}

window.addEventListener('pointerdown', e => {
  audioInit();
  try { cv.focus({ preventScroll: true }); } catch (_) {}
  const p = toLogical(e);
  if (inBtn(p, BTN.mute)) return; // handled on click
  if (G.state === 'title') { startGame(); return; }
  if (G.state === 'paused') { G.state = 'play'; return; }
  if (G.state === 'over') return; // buttons on click
  ctrl = 'ptr';
  if (e.pointerType === 'mouse') player.tx = p.x;
  else drag = { id: e.pointerId, sx: p.x, px: player.x };
});
window.addEventListener('pointermove', e => {
  if (G.state !== 'play') return;
  const p = toLogical(e);
  if (e.pointerType === 'mouse') { ctrl = 'ptr'; player.tx = p.x; }
  else if (drag && drag.id === e.pointerId) { ctrl = 'ptr'; player.tx = drag.px + (p.x - drag.sx) * 1.35; }
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
window.addEventListener('pointerup', e => { audioInit(); endDrag(e); });
window.addEventListener('pointercancel', endDrag);
window.addEventListener('click', e => {
  audioInit();
  const p = toLogical(e);
  if (inBtn(p, BTN.mute)) { muted = !muted; return; }
  if (G.state === 'over' && G.overT > 0.8) {
    if (inBtn(p, BTN.share)) share();
    else if (inBtn(p, BTN.retry)) startGame();
  }
});
window.addEventListener('keydown', e => {
  audioInit();
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; ctrl = 'key'; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; ctrl = 'key'; }
  if (k === 'm' || k === 'M') muted = !muted;
  if (k === 'c' || k === 'C') {
    const off = crt.classList.toggle('off');
    try { localStorage.setItem('fb-crt', off ? 'off' : 'on'); } catch (_) {}
  }
  if (k === ' ' || k === 'Enter') {
    if (G.state === 'title') startGame();
    else if (G.state === 'over' && G.overT > 0.8) startGame();
    else if (G.state === 'paused') G.state = 'play';
  }
  if ((k === 'p' || k === 'P' || k === 'Escape') && (G.state === 'play' || G.state === 'paused'))
    G.state = G.state === 'play' ? 'paused' : 'play';
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});
const autoPause = () => { if (G.state === 'play') G.state = 'paused'; keys.left = keys.right = false; };
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
window.addEventListener('blur', autoPause);

/* -------------------------------------------------------------------- loop */
let last = performance.now(), acc = 0;
function frame(now) {
  let d = (now - last) / 1000; last = now;
  if (d > 0.25) d = 0.25;
  acc += d;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  if (!crt.classList.contains('off')) { gctx.clearRect(0, 0, W, H); gctx.drawImage(cv, 0, 0); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook: open with ?debug to poke at state from the console
if (/[?&]debug\b/.test(location.search)) window.__fb = { G, SPR, CHARS, get player() { return player; }, get ally() { return ally; }, talk, say, get boss() { return boss; }, get ebullets() { return ebullets; }, get bullets() { return bullets; }, get pickups() { return pickups; }, dropPickup, startGame, spawnBoss, nextWave, gameOver, bossDefeated, bgState, setTheme, THEMES, drawBackground, updateBg, update, draw };
})();
</script>
</body>
