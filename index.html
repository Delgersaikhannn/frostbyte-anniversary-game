<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ setup */
const W = 160, H = 160;
const GAME_URL = 'https://delgersaikhannn.github.io/frostbyte-anniversary-game/';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fit);
fit();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

/* ---------------------------------------------------------------- palette */
const P = {
  k: '#0b0b14', K: '#15142a', n: '#25204a', N: '#3b3470',
  c: '#2ec4e6', C: '#9af2ff', d: '#1a7fa3', w: '#f4f6ff',
  s: '#d6cff2', S: '#8f86c0', p: '#5b26a3', P: '#9b55f0',
  m: '#ff3fd0', M: '#ff9ae9', g: '#7dff6a', G: '#2fae4a',
  y: '#ffe14d', o: '#ff8a3d', r: '#ff4057', R: '#a3172f',
};
const CONFETTI = [P.m, P.c, P.y, P.g, P.P, P.w, P.o];

/* ---------------------------------------------------------------- sprites */
function sprite(rows, map) {
  const h = rows.length, w = rows[0].length;
  const make = (white) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      let ch = rows[j][i];
      if (map && map[ch]) ch = map[ch];
      if (ch !== '.' && P[ch]) { x.fillStyle = white ? '#ffffff' : P[ch]; x.fillRect(i, j, 1, 1); }
    }
    return c;
  };
  const c = make(false); c.white = make(true);
  return c;
}
const pad = (s, n) => { const l = (n - s.length) >> 1; return '.'.repeat(l) + s + '.'.repeat(n - s.length - l); };

const PLAYER_ROWS = [
  '...cccccc...',
  '..cccwcwccc.',
  '..ccccwcccc.',
  '..cccwcwccc.',
  '.dddddddddCC',
  '.pssssssssp.',
  '.pskksskksp.',
  '.pskksskksp.',
  '..ssssssss..',
  '..cccwwccc..',
  '.cccwccwccc.',
  '.cccccccccc.',
  '..NN....NN..',
];
const SPR = {
  player: sprite(PLAYER_ROWS),
  ufo1a: sprite(['....gggg....', '...gkggkg...', '...gggggg...', '.pPPPPPPPPp.', 'pPyPPyPPyPPp', '.pppppppppp.', '...p....p...']),
  ufo1b: sprite(['....gggg....', '...gkggkg...', '...gggggg...', '.pPPPPPPPPp.', 'pPPyPPyPPyPp', '.pppppppppp.', '...p....p...']),
  ufo2a: sprite(['....gggg....', '...gkggkg...', '...gggggg...', '.pPPPPPPPPp.', 'pPyPPyPPyPPp', '.pppppppppp.', '...p....p...'], { g: 'o', P: 'r', p: 'R' }),
  ufo2b: sprite(['....gggg....', '...gkggkg...', '...gggggg...', '.pPPPPPPPPp.', 'pPPyPPyPPyPp', '.pppppppppp.', '...p....p...'], { g: 'o', P: 'r', p: 'R' }),
  bossA: sprite([
    pad('gggggggg', 28), pad('ggkkggggkkgg', 28), pad('CC' + 'g'.repeat(12) + 'CC', 28),
    pad('C'.repeat(20), 28), pad('p' + 'P'.repeat(22) + 'p', 28), pad('p' + 'PPPy'.repeat(6) + 'P', 28),
    pad('p' + 'P'.repeat(24) + 'p', 28), pad('p'.repeat(22), 28), pad('m.....m.....m.....m', 28),
  ]),
  bossB: sprite([
    pad('gggggggg', 28), pad('ggkkggggkkgg', 28), pad('CC' + 'g'.repeat(12) + 'CC', 28),
    pad('C'.repeat(20), 28), pad('p' + 'P'.repeat(22) + 'p', 28), pad('p' + 'PPyP'.repeat(6) + 'P', 28),
    pad('p' + 'P'.repeat(24) + 'p', 28), pad('p'.repeat(22), 28), pad('M.....M.....M.....M', 28),
  ]),
  cake: sprite(['...y...', '...w...', '.MMMMM.', 'MwMwMwM', 'mmmmmmm', 'mMMMMMm', 'mmmmmmm']),
  flake: sprite(['C..C..C', '.C.C.C.', '..CwC..', 'CCwwwCC', '..CwC..', '.C.C.C.', 'C..C..C']),
  heart: sprite(['.rr.rr.', 'rMrrrrr', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...']),
  heartS: sprite(['.r.r.', 'rrrrr', 'rrrrr', '.rrr.', '..r..']),
  heartE: sprite(['.n.n.', 'nnnnn', 'nnnnn', '.nnn.', '..n..']),
  snow: sprite(['.C.', 'CwC', '.C.']),
};

/* ------------------------------------------------------------- pixel font */
const FONT = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110',
  E: '111100110100111', F: '111100110100100', G: '011100101101011', H: '101101111101101',
  I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100',
  Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111',
  0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
  4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010',
  8: '111101111101111', 9: '111101111001110',
  '!': '010010010000010', '.': '000000000000010', ':': '000010000010000', '-': '000000111000000',
  '/': '001001010100100', '?': '110001010000010', '+': '000010111010000', "'": '010010000000000',
  ',': '000000000010100', '#': '101111101111101', ' ': '000000000000000',
};
const textW = (s, sc = 1) => s.length * 4 * sc - sc;
function drawStr(s, x, y, col, sc) {
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = FONT[s[i]];
    if (!g) continue;
    for (let b = 0; b < 15; b++) if (g[b] === '1')
      ctx.fillRect(x + i * 4 * sc + (b % 3) * sc, y + ((b / 3) | 0) * sc, sc, sc);
  }
}
function text(s, x, y, col, sc = 1, align = 'l', shadow) {
  s = String(s).toUpperCase();
  if (align === 'c') x = Math.round(x - textW(s, sc) / 2);
  else if (align === 'r') x = x - textW(s, sc);
  if (shadow) drawStr(s, x + sc, y + sc, shadow, sc);
  drawStr(s, x, y, col, sc);
}

/* ------------------------------------------------------------------ audio */
let AC = null, muted = false;
function audioInit() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', vol = 0.05, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, vol = 0.08) {
  if (!AC || muted) return;
  const len = (AC.sampleRate * d) | 0, b = AC.createBuffer(1, len, AC.sampleRate), data = b.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = b; g.gain.value = vol; s.connect(g); g.connect(AC.destination); s.start();
}
const SFX = {
  shoot() { tone(1200, 0.04, 'triangle', 0.025, -600); },
  hit() { tone(320, 0.06, 'square', 0.035, -160); },
  boom() { noise(0.22, 0.06); tone(160, 0.18, 'triangle', 0.06, -100); },
  power() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.09, 'square', 0.035, 0, i * 0.06)); },
  hurt() { noise(0.35, 0.1); tone(220, 0.35, 'sawtooth', 0.05, -160); },
  start() { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.08, 'square', 0.035, 0, i * 0.07)); },
  alarm() { for (let i = 0; i < 3; i++) { tone(440, 0.15, 'sawtooth', 0.035, 0, i * 0.3); tone(330, 0.15, 'sawtooth', 0.035, 0, i * 0.3 + 0.15); } },
  over() { [523, 392, 330, 262].forEach((f, i) => tone(f, 0.2, 'triangle', 0.06, 0, i * 0.18)); },
  birthday() { // "Happy Birthday" (public domain)
    const G4 = 392, A4 = 440, B4 = 493.9, C5 = 523.3, D5 = 587.3;
    const notes = [[G4, .14], [G4, .14], [A4, .3], [G4, .3], [C5, .3], [B4, .55], [G4, .14], [G4, .14], [A4, .3], [G4, .3], [D5, .3], [C5, .6]];
    let t = 0.1; for (const [f, d] of notes) { tone(f, d * 0.95, 'square', 0.035, 0, t); t += d + 0.03; }
  },
};

/* ------------------------------------------------------------- high score */
function loadBest() { try { return parseInt(localStorage.getItem('fb2_best') || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('fb2_best', String(v)); } catch (e) { /* storage blocked in embeds: fine */ } }

/* -------------------------------------------------------------- background */
const stars = Array.from({ length: 46 }, () => ({ x: (Math.random() * W) | 0, y: (Math.random() * 118) | 0, p: Math.random() * 6.28, c: pick([P.S, P.N, P.C]) }));
const flakes = Array.from({ length: 34 }, () => ({ x: Math.random() * W, y: Math.random() * H, v: rnd(4, 12), p: Math.random() * 6.28 }));
const hills = [], snowTop = [];
for (let x = 0; x < W; x++) {
  hills[x] = Math.round(128 + Math.sin(x * 0.045) * 6 + Math.sin(x * 0.13 + 1) * 3);
  snowTop[x] = (Math.sin(x * 0.31) + Math.sin(x * 0.17 + 2)) > 0.7 ? 1 : 0;
}
const trees = [12, 31, 58, 104, 127, 147].map(x => ({ x, h: 8 + ((x * 7) % 6) }));

function updateBg(dt) {
  for (const f of flakes) {
    f.y += f.v * dt; f.p += dt;
    f.x += Math.sin(f.p) * 4 * dt;
    if (f.y > 150) { f.y = -2; f.x = Math.random() * W; }
  }
}
function drawBg(t) {
  ctx.fillStyle = P.k; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    if (Math.sin(t * 2 + s.p) > -0.3) { ctx.fillStyle = s.c; ctx.fillRect(s.x, s.y, 1, 1); }
  }
  // moon
  ctx.fillStyle = P.N; ctx.fillRect(126, 22, 8, 8); ctx.fillRect(125, 23, 10, 6); ctx.fillRect(127, 21, 6, 10);
  ctx.fillStyle = P.k; ctx.fillRect(129, 21, 6, 7); ctx.fillRect(131, 20, 5, 9);
  // hills + trees
  ctx.fillStyle = P.K;
  for (let x = 0; x < W; x++) ctx.fillRect(x, hills[x], 1, 150 - hills[x]);
  for (const tr of trees) {
    const by = hills[tr.x];
    ctx.fillStyle = P.n;
    for (let i = 0; i < tr.h; i++) { const w = 1 + ((i * 0.6) | 0); ctx.fillRect(tr.x - w, by - tr.h + i, w * 2 + 1, 1); }
    // party lights
    ctx.fillStyle = CONFETTI[(((t * 3) | 0) + tr.x) % CONFETTI.length];
    ctx.fillRect(tr.x, by - tr.h - 1, 1, 1);
  }
  // falling snow
  ctx.fillStyle = P.S;
  for (const f of flakes) ctx.fillRect(f.x | 0, f.y | 0, 1, 1);
  // ground
  ctx.fillStyle = P.n; ctx.fillRect(0, 150, W, 10);
  ctx.fillStyle = P.N; ctx.fillRect(0, 152, W, 1);
  ctx.fillStyle = P.w;
  for (let x = 0; x < W; x++) ctx.fillRect(x, 150 - snowTop[x], 1, 1 + snowTop[x]);
  ctx.fillStyle = P.C; for (let x = 3; x < W; x += 11) ctx.fillRect(x, 151, 1, 1);
}

/* -------------------------------------------------------------- game state */
const G = { state: 'title', t: 0, score: 0, best: loadBest(), newBest: false, lives: 3, wave: 1, kills: 0, waveKills: 0,
  spawn: 1, bossCount: 0, shake: 0, flash: 0, banner: null, overT: 0, prevState: 'play' };
let player, bullets, ebullets, enemies, pickups, parts, boss;
parts = [];

function reset() {
  player = { x: 80, y: 136, tx: 80, fire: 0, triple: 0, shield: 0, inv: 1 };
  bullets = []; ebullets = []; enemies = []; pickups = []; parts = []; boss = null;
  Object.assign(G, { score: 0, newBest: false, lives: 3, wave: 1, kills: 0, waveKills: 0, spawn: 1.2, bossCount: 0, shake: 0, flash: 0, overT: 0 });
  banner('WAVE 1', 'PROTECT THE PARTY!', 2);
}
function banner(text, sub, t = 1.8, col = P.w) { G.banner = { text, sub, t, max: t, col }; }

function startGame() { audioInit(); reset(); G.state = 'play'; SFX.start(); }

/* ---------------------------------------------------------------- spawning */
function spawnEnemy() {
  const tough = G.wave >= 2 && Math.random() < Math.min(0.5, 0.12 * G.wave);
  const bx = rnd(14, 146);
  enemies.push({
    t: tough ? 2 : 1, hp: tough ? 2 : 1, bx, x: bx, y: -8,
    vy: (8 + G.wave * 1.7) * (tough ? 0.85 : 1) * rnd(0.85, 1.15),
    amp: rnd(4, 18), ph: Math.random() * 6.28, sp: rnd(1.2, 2.2),
    shoot: rnd(1.5, 4), hit: 0,
  });
}
function spawnBoss() {
  const n = G.bossCount;
  boss = { x: 80, y: -14, hp: 40 + n * 20, max: 40 + n * 20, dir: 1, sp: 26 + n * 6, fire: 2, minion: 4, hit: 0 };
  banner('MOTHERSHIP!', 'SHOOT IT DOWN', 2.2, P.r);
  SFX.alarm();
}
function dropPickup(x, y, forced) {
  let type = forced;
  if (!type) {
    const r = Math.random();
    type = r < 0.45 ? 'cake' : r < 0.75 ? 'flake' : 'heart';
    if (type === 'heart' && G.lives >= 5) type = 'cake';
  }
  pickups.push({ x, y, type, t: 0 });
}

/* ---------------------------------------------------------------- particles */
function burst(x, y, cols, n = 14, sp = 50, life = 0.6) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = rnd(sp * 0.3, sp);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 40, life: rnd(life * 0.5, life), c: pick(cols), conf: false });
  }
}
function confetti(n, fromTop) {
  for (let i = 0; i < n; i++) {
    parts.push({
      x: fromTop ? Math.random() * W : 80 + rnd(-10, 10), y: fromTop ? rnd(-20, 0) : 80,
      vx: fromTop ? rnd(-6, 6) : rnd(-70, 70), vy: fromTop ? rnd(10, 25) : rnd(-90, -20),
      g: fromTop ? 0 : 50, life: rnd(2, 4), c: pick(CONFETTI), conf: true, p: Math.random() * 6.28,
    });
  }
}
function updParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.vy += q.g * dt;
    if (q.conf) { q.p += dt * 6; q.vx *= 0.985; if (q.vy > 30) q.vy = 30; q.x += Math.sin(q.p) * 10 * dt; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
    if (q.life <= 0 || q.y > H + 4) parts.splice(i, 1);
  }
}

/* ----------------------------------------------------------------- damage */
function hurtPlayer(free) {
  if (player.inv > 0) return;
  if (player.shield > 0) { player.shield = 0; player.inv = 1; SFX.hit(); burst(player.x, player.y + 6, [P.C, P.w], 16, 60); return; }
  if (free) return;
  G.lives--; player.inv = 1.8; G.shake = 0.35; G.flash = 0.15; SFX.hurt();
  burst(player.x, player.y + 6, [P.c, P.w, P.m], 22, 70);
  if (G.lives <= 0) gameOver();
}
function gameOver() {
  G.state = 'over'; G.overT = 0;
  if (G.score > G.best) { G.best = G.score; G.newBest = true; saveBest(G.best); }
  SFX.over();
}
function killEnemy(e, i) {
  enemies.splice(i, 1);
  G.score += e.t === 2 ? 25 : 10;
  G.kills++; G.waveKills++;
  burst(e.x, e.y + 3, e.t === 2 ? [P.o, P.r, P.y] : [P.g, P.P, P.y], 14, 55);
  SFX.boom();
  if (Math.random() < 0.08 || G.kills % 25 === 0) dropPickup(e.x, e.y);
  if (!boss && G.waveKills >= 12) nextWave();
}
function nextWave() {
  G.wave++; G.waveKills = 0;
  if (G.wave % 4 === 0) spawnBoss();
  else banner('WAVE ' + G.wave, G.wave === 2 ? 'RED SAUCERS TAKE 2 HITS' : 'THEY KEEP COMING!', 1.6);
}
function bossDefeated() {
  const b = boss; boss = null;
  G.score += 500 * (G.bossCount + 1); G.bossCount++;
  G.shake = 0.6; G.flash = 0.25;
  for (let i = 0; i < 4; i++) burst(b.x + rnd(-12, 12), b.y + rnd(0, 8), [P.y, P.m, P.c, P.w, P.g], 22, 90, 1);
  confetti(90, true); confetti(40, false);
  dropPickup(b.x - 8, b.y + 6, 'heart'); dropPickup(b.x + 8, b.y + 6, 'cake');
  banner('HAPPY 2ND BIRTHDAY', 'FROSTBYTE! +' + 500 * G.bossCount, 3.5, P.y);
  SFX.boom(); SFX.birthday();
  G.wave++; G.waveKills = 0;
}

/* ------------------------------------------------------------------ update */
const STEP = 1 / 60;
function update(dt) {
  G.t += dt;
  updateBg(dt);
  if (G.state === 'title') {
    if (Math.random() < 0.25) confetti(1, true);
    updParts(dt); return;
  }
  if (G.state === 'paused') return;
  if (G.state === 'over') { G.overT += dt; if (G.newBest && Math.random() < 0.3) confetti(1, true); updParts(dt); return; }

  if (G.shake > 0) G.shake -= dt;
  if (G.flash > 0) G.flash -= dt;
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }

  // player movement
  const pl = player;
  if (ctrl === 'key') {
    const dx = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
    pl.x += dx * 100 * dt; pl.tx = pl.x;
  } else {
    const d = pl.tx - pl.x, mx = 240 * dt;
    pl.x += clamp(d, -mx, mx);
  }
  pl.x = clamp(pl.x, 7, 153); pl.tx = clamp(pl.tx, 7, 153);
  if (pl.triple > 0) pl.triple -= dt;
  if (pl.shield > 0) pl.shield -= dt;
  if (pl.inv > 0) pl.inv -= dt;

  // auto-fire snowballs
  pl.fire -= dt;
  if (pl.fire <= 0) {
    pl.fire = 0.2;
    bullets.push({ x: pl.x, y: pl.y - 2, vx: 0, vy: -165 });
    if (pl.triple > 0) bullets.push({ x: pl.x - 3, y: pl.y, vx: -42, vy: -155 }, { x: pl.x + 3, y: pl.y, vx: 42, vy: -155 });
    SFX.shoot();
  }
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -4 || b.x < -4 || b.x > W + 4) bullets.splice(i, 1);
  }

  // spawning
  G.spawn -= dt;
  if (G.spawn <= 0) {
    spawnEnemy();
    G.spawn = boss ? 3.2 : Math.max(0.38, 1.45 - (G.wave - 1) * 0.12);
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.vy * dt; e.ph += dt * e.sp;
    e.bx = clamp(e.bx, 8 + e.amp, 152 - e.amp);
    e.x = e.bx + Math.sin(e.ph) * e.amp;
    if (e.hit > 0) e.hit -= dt;
    if (e.t === 2 || G.wave >= 3) {
      e.shoot -= dt;
      if (e.shoot <= 0 && e.y > 4 && e.y < 112) {
        ebullets.push({ x: e.x, y: e.y + 7, vx: clamp((pl.x - e.x) * 0.3, -30, 30), vy: 52 + G.wave * 3 });
        e.shoot = e.t === 2 ? rnd(1.6, 3) : rnd(3, 5.5);
      }
    }
    // collide with player
    if (Math.abs(e.x - pl.x) < 10 && e.y + 7 > pl.y + 2 && e.y < pl.y + 12) {
      enemies.splice(i, 1); burst(e.x, e.y + 3, [P.g, P.P], 12, 50); SFX.boom(); hurtPlayer(); continue;
    }
    // landed: lose a heart
    if (e.y > 143) {
      enemies.splice(i, 1); burst(e.x, 148, [P.r, P.o, P.w], 16, 60);
      if (player.inv <= 0) banner('ALIEN LANDED!', '', 0.9, P.r);
      hurtPlayer(); continue;
    }
  }

  // bullets vs enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.x > e.x - 7 && b.x < e.x + 7 && b.y > e.y - 2 && b.y < e.y + 8) {
        bullets.splice(j, 1);
        e.hp--; e.hit = 0.08;
        if (e.hp <= 0) { killEnemy(e, i); break; }
        SFX.hit(); burst(b.x, b.y, [P.w, P.C], 4, 30, 0.25);
      }
    }
  }

  // boss
  if (boss) {
    const b = boss;
    if (b.y < 20) b.y += 18 * dt;
    else {
      b.x += b.dir * b.sp * dt;
      if (b.x > 140) { b.x = 140; b.dir = -1; }
      if (b.x < 20) { b.x = 20; b.dir = 1; }
      b.fire -= dt;
      if (b.fire <= 0) {
        const n = 3 + Math.min(2, G.bossCount);
        for (let k = 0; k < n; k++) ebullets.push({ x: b.x, y: b.y + 9, vx: (k - (n - 1) / 2) * 22, vy: 58 });
        b.fire = Math.max(0.9, 1.6 - G.bossCount * 0.15);
      }
      b.minion -= dt;
      if (b.minion <= 0) { spawnEnemy(); const e = enemies[enemies.length - 1]; e.bx = b.x; e.y = b.y + 8; b.minion = rnd(3, 5); }
    }
    if (b.hit > 0) b.hit -= dt;
    for (let j = bullets.length - 1; j >= 0; j--) {
      const s = bullets[j];
      if (s.x > b.x - 14 && s.x < b.x + 14 && s.y > b.y && s.y < b.y + 9) {
        bullets.splice(j, 1); b.hp--; b.hit = 0.06; G.score += 2;
        burst(s.x, s.y, [P.w, P.C, P.y], 3, 30, 0.25);
        if (b.hp <= 0) { bossDefeated(); break; }
        if (b.hp % 4 === 0) SFX.hit();
      }
    }
  }

  // enemy bullets
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > 152) { ebullets.splice(i, 1); continue; }
    if (Math.abs(b.x - pl.x) < 5 && b.y > pl.y + 2 && b.y < pl.y + 13) { ebullets.splice(i, 1); hurtPlayer(); }
  }

  // pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const k = pickups[i]; k.t += dt; k.y += 26 * dt;
    if (k.y > 146) { pickups.splice(i, 1); continue; }
    if (Math.abs(k.x - pl.x) < 9 && k.y + 7 > pl.y && k.y < pl.y + 13) {
      pickups.splice(i, 1); SFX.power();
      burst(k.x, k.y + 3, CONFETTI, 18, 50);
      if (k.type === 'cake') { pl.triple = 9; banner('PARTY CAKE!', 'TRIPLE SNOWBALLS', 1.2, P.M); }
      else if (k.type === 'flake') { pl.shield = 10; banner('FROST SHIELD!', '', 1.2, P.C); }
      else { G.lives = Math.min(5, G.lives + 1); banner('+1 HEART', '', 1.2, P.r); }
      G.score += 15;
    }
  }

  updParts(dt);
}

/* -------------------------------------------------------------------- draw */
const BTN = {
  retry: { x: 48, y: 96, w: 64, h: 13 },
  share: { x: 36, y: 114, w: 88, h: 13 },
  mute: { x: 148, y: 151, w: 11, h: 9 },
};
function box(b, label, col) {
  ctx.fillStyle = P.K; ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = col;
  ctx.fillRect(b.x + 1, b.y, b.w - 2, 1); ctx.fillRect(b.x + 1, b.y + b.h - 1, b.w - 2, 1);
  ctx.fillRect(b.x, b.y + 1, 1, b.h - 2); ctx.fillRect(b.x + b.w - 1, b.y + 1, 1, b.h - 2);
  text(label, b.x + b.w / 2, b.y + ((b.h - 5) >> 1), col, 1, 'c');
}
function drawMute() {
  const b = BTN.mute, x = b.x + 1, y = b.y + 2;
  ctx.fillStyle = muted ? P.S : P.C;
  ctx.fillRect(x, y + 1, 2, 3); ctx.fillRect(x + 2, y, 1, 5); ctx.fillRect(x + 3, y - 1, 1, 7);
  if (muted) { ctx.fillStyle = P.r; ctx.fillRect(x + 5, y, 1, 1); ctx.fillRect(x + 6, y + 1, 1, 1); ctx.fillRect(x + 7, y + 2, 1, 1); ctx.fillRect(x + 6, y + 3, 1, 1); ctx.fillRect(x + 5, y + 4, 1, 1); ctx.fillRect(x + 7, y, 1, 1); ctx.fillRect(x + 7, y + 4, 1, 1); ctx.fillRect(x + 5, y + 2, 1, 1); }
  else { ctx.fillRect(x + 5, y + 1, 1, 3); ctx.fillRect(x + 7, y, 1, 5); }
}
function drawPlayer(x, y, sc = 1) {
  const s = SPR.player;
  ctx.drawImage(s, Math.round(x - 6 * sc), Math.round(y), 12 * sc, 13 * sc);
}
function drawShield(x, y) {
  ctx.fillStyle = ((G.t * 8) | 0) % 2 ? P.C : P.c;
  for (let a = 0; a < 20; a++) {
    const ang = a / 20 * 6.283 + G.t * 2;
    ctx.fillRect(Math.round(x + Math.cos(ang) * 10), Math.round(y + 6 + Math.sin(ang) * 10), 1, 1);
  }
}

function draw() {
  ctx.save();
  if (G.shake > 0) ctx.translate(((Math.random() * 3) | 0) - 1, ((Math.random() * 3) | 0) - 1);
  drawBg(G.t);

  if (G.state === 'title') drawTitle();
  else drawPlay();

  // particles
  for (const q of parts) {
    ctx.fillStyle = q.c;
    if (q.conf) ctx.fillRect(q.x | 0, q.y | 0, Math.sin(q.p) > 0 ? 2 : 1, 1);
    else ctx.fillRect(q.x | 0, q.y | 0, 1, 1);
  }
  ctx.restore();

  if (G.state === 'over') drawOver();
  if (G.state === 'paused') {
    ctx.fillStyle = 'rgba(11,11,20,0.7)'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', 80, 66, P.C, 2, 'c', P.p);
    if (((G.t * 2) | 0) % 2 === 0) text('TAP TO RESUME', 80, 88, P.w, 1, 'c');
  }
  if (G.flash > 0) { ctx.fillStyle = 'rgba(255,64,87,0.35)'; ctx.fillRect(0, 0, W, H); }
  drawMute();
}

function drawTitle() {
  const t = G.t;
  // title
  text('FROSTBYTE', 80, 14, P.c, 3, 'c', P.p);
  ctx.fillStyle = P.m; ctx.fillRect(22, 33, 116, 1);
  text('2ND ANNIVERSARY', 80, 37, P.M, 1, 'c');
  text('ALIEN DEFENSE', 80, 46, P.w, 2, 'c', P.n);

  // hero + saucers
  const bob = Math.round(Math.sin(t * 3) * 2);
  drawPlayer(80, 72 + bob, 2);
  const f = ((t * 6) | 0) % 2;
  for (let i = 0; i < 3; i++) {
    const a = t * 1.3 + i * 2.094;
    const ux = 80 + Math.cos(a) * 46, uy = 82 + Math.sin(a) * 10;
    ctx.drawImage(i === 1 ? (f ? SPR.ufo2a : SPR.ufo2b) : (f ? SPR.ufo1a : SPR.ufo1b), Math.round(ux - 6), Math.round(uy));
  }
  // birthday cake on the snow
  ctx.drawImage(SPR.cake, 18, 141, 7, 7);
  ctx.drawImage(SPR.cake, 135, 141, 7, 7);

  if (((t * 2.2) | 0) % 2 === 0) text('TAP OR SPACE TO PLAY', 80, 112, P.C, 1, 'c');
  text('DRAG / ARROWS TO MOVE', 80, 122, P.S, 1, 'c');
  text('AUTO-FIRE ON', 80, 129, P.S, 1, 'c');
  if (G.best > 0) text('BEST ' + G.best, 80, 140, P.y, 1, 'c');
}

function drawPlay() {
  const f = ((G.t * 6) | 0) % 2;
  // pickups
  for (const k of pickups) {
    const s = SPR[k.type], yy = Math.round(k.y + Math.sin(k.t * 6));
    if (((k.t * 10) | 0) % 6 === 0) { ctx.fillStyle = P.w; ctx.fillRect(k.x - 5, yy + 3, 1, 1); ctx.fillRect(k.x + 5, yy + 3, 1, 1); }
    ctx.drawImage(s, Math.round(k.x - 3), yy);
  }
  // enemies
  for (const e of enemies) {
    let s = e.t === 2 ? (f ? SPR.ufo2a : SPR.ufo2b) : (f ? SPR.ufo1a : SPR.ufo1b);
    if (e.hit > 0) s = s.white;
    ctx.drawImage(s, Math.round(e.x - 6), Math.round(e.y));
  }
  // boss
  if (boss) {
    let s = f ? SPR.bossA : SPR.bossB;
    if (boss.hit > 0) s = s.white;
    ctx.drawImage(s, Math.round(boss.x - 14), Math.round(boss.y));
    // tractor beam shimmer
    ctx.fillStyle = P.G;
    const bx0 = Math.round(boss.x), by0 = Math.round(boss.y + 9), ph = (G.t * 12) | 0;
    for (let j = 0; j < 18; j++) {
      const half = 2 + (j >> 2);
      for (let i = -half; i <= half; i++) if (((i + j + ph) & 3) === 0) ctx.fillRect(bx0 + i, by0 + j, 1, 1);
    }
    // hp bar
    ctx.fillStyle = P.n; ctx.fillRect(40, 12, 80, 3);
    ctx.fillStyle = P.r; ctx.fillRect(40, 12, Math.ceil(80 * boss.hp / boss.max), 3);
    ctx.fillStyle = P.M; ctx.fillRect(40, 12, Math.ceil(80 * boss.hp / boss.max), 1);
  }
  // bullets
  for (const b of bullets) ctx.drawImage(SPR.snow, Math.round(b.x - 1), Math.round(b.y - 1));
  for (const b of ebullets) {
    ctx.fillStyle = f ? P.m : P.M; ctx.fillRect(Math.round(b.x - 1), Math.round(b.y - 1), 2, 3);
    ctx.fillStyle = P.w; ctx.fillRect(Math.round(b.x - 1), Math.round(b.y), 1, 1);
  }
  // player
  const pl = player;
  if (G.state !== 'over' && !(pl.inv > 0 && ((G.t * 14) | 0) % 2)) drawPlayer(pl.x, pl.y);
  if (pl.shield > 0 && (pl.shield > 2 || ((G.t * 10) | 0) % 2)) drawShield(pl.x, pl.y);

  // HUD
  text(String(G.score).padStart(6, '0'), 2, 2, P.w, 1, 'l', P.n);
  text('W' + G.wave, 80, 2, P.S, 1, 'c');
  for (let i = 0; i < 5; i++) {
    const x = 153 - i * 6;
    if (i < G.lives) ctx.drawImage(SPR.heartS, x, 2);
    else if (i < 3) ctx.drawImage(SPR.heartE, x, 2);
  }
  let by = 9;
  if (pl.triple > 0) { ctx.fillStyle = P.m; ctx.fillRect(2, by, Math.ceil(pl.triple / 9 * 24), 1); by += 2; }
  if (pl.shield > 0) { ctx.fillStyle = P.C; ctx.fillRect(2, by, Math.ceil(pl.shield / 10 * 24), 1); }

  // banner
  if (G.banner && G.state === 'play') {
    const b = G.banner;
    const blink = b.t < 0.4 && ((G.t * 12) | 0) % 2;
    if (!blink) {
      const sc = b.text.length > 12 ? 1 : 2;
      text(b.text, 80, 56, b.col, sc, 'c', P.p);
      if (b.sub) text(b.sub, 80, sc === 2 ? 70 : 64, P.S, 1, 'c');
    }
  }
}

function drawOver() {
  ctx.fillStyle = 'rgba(11,11,20,0.78)'; ctx.fillRect(0, 0, W, H);
  text('GAME OVER', 80, 22, P.m, 2, 'c', P.p);
  text('THE ALIENS ATE THE CAKE', 80, 38, P.S, 1, 'c');
  text('SCORE', 80, 52, P.S, 1, 'c');
  text(String(G.score), 80, 60, P.w, 2, 'c', P.n);
  if (G.newBest) { if (((G.t * 3) | 0) % 2 === 0) text('NEW BEST!', 80, 76, P.y, 1, 'c'); }
  else text('BEST ' + G.best, 80, 76, P.y, 1, 'c');
  text('REACHED WAVE ' + G.wave, 80, 84, P.S, 1, 'c');
  if (G.overT > 0.8) {
    box(BTN.retry, 'PLAY AGAIN', P.C);
    box(BTN.share, 'SHARE SCORE ON X', P.M);
  }
}

/* ------------------------------------------------------------------- input */
const keys = { left: false, right: false };
let ctrl = 'ptr';
let drag = null;

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
const inBtn = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

function share() {
  const msg = `I scored ${G.score} defending FROSTBYTE from an alien invasion at its 2nd anniversary party! Can you beat me? ❄️👾🎂`;
  const url = 'https://x.com/intent/tweet?text=' + encodeURIComponent(msg) + '&url=' + encodeURIComponent(GAME_URL);
  const w = window.open(url, '_blank', 'noopener');
  if (!w) { try { window.top.location.href = url; } catch (e) { location.href = url; } }
}

window.addEventListener('pointerdown', e => {
  audioInit();
  try { cv.focus({ preventScroll: true }); } catch (_) {}
  const p = toLogical(e);
  if (inBtn(p, BTN.mute)) return; // handled on click
  if (G.state === 'title') { startGame(); return; }
  if (G.state === 'paused') { G.state = 'play'; return; }
  if (G.state === 'over') return; // buttons on click
  ctrl = 'ptr';
  if (e.pointerType === 'mouse') player.tx = p.x;
  else drag = { id: e.pointerId, sx: p.x, px: player.x };
});
window.addEventListener('pointermove', e => {
  if (G.state !== 'play') return;
  const p = toLogical(e);
  if (e.pointerType === 'mouse') { ctrl = 'ptr'; player.tx = p.x; }
  else if (drag && drag.id === e.pointerId) { ctrl = 'ptr'; player.tx = drag.px + (p.x - drag.sx) * 1.35; }
});
const endDrag = e => { if (drag && drag.id === e.pointerId) drag = null; };
window.addEventListener('pointerup', e => { audioInit(); endDrag(e); });
window.addEventListener('pointercancel', endDrag);
window.addEventListener('click', e => {
  audioInit();
  const p = toLogical(e);
  if (inBtn(p, BTN.mute)) { muted = !muted; return; }
  if (G.state === 'over' && G.overT > 0.8) {
    if (inBtn(p, BTN.share)) share();
    else if (inBtn(p, BTN.retry)) startGame();
  }
});
window.addEventListener('keydown', e => {
  audioInit();
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; ctrl = 'key'; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; ctrl = 'key'; }
  if (k === 'm' || k === 'M') muted = !muted;
  if (k === ' ' || k === 'Enter') {
    if (G.state === 'title') startGame();
    else if (G.state === 'over' && G.overT > 0.8) startGame();
    else if (G.state === 'paused') G.state = 'play';
  }
  if ((k === 'p' || k === 'P' || k === 'Escape') && (G.state === 'play' || G.state === 'paused'))
    G.state = G.state === 'play' ? 'paused' : 'play';
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});
const autoPause = () => { if (G.state === 'play') G.state = 'paused'; keys.left = keys.right = false; };
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
window.addEventListener('blur', autoPause);

/* -------------------------------------------------------------------- loop */
let last = performance.now(), acc = 0;
function frame(now) {
  let d = (now - last) / 1000; last = now;
  if (d > 0.25) d = 0.25;
  acc += d;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test hook: open with ?debug to poke at state from the console
if (/[?&]debug\b/.test(location.search)) window.__fb = { G, get player() { return player; }, startGame, spawnBoss, nextWave, gameOver, bossDefeated };
})();
</script>
